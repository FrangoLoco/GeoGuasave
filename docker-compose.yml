services:
  db:
    # PostgreSQL 17.5 + PostGIS 3.5.2, fijada por digest (ver docs/decisiones.md).
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_datos:/var/lib/postgresql/data
      # Reemplaza el init de la imagen: solo se crean las extensiones que usamos.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  # API de GeoGuasave (Node.js + Fastify). Requiere los datos cargados: ./iniciar.sh
  api:
    build: ./api
    environment:
      # Variables estándar de libpq, que lee el cliente pg.
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      LPR_MAX_DIST_M: ${LPR_MAX_DIST_M:-500}
      POOL: "10"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  gdal:
    # GDAL 3.10.3, fijada por digest. Solo herramientas: docker compose run --rm gdal <comando>
    image: ghcr.io/osgeo/gdal:ubuntu-small-3.10.3@sha256:dab45abca3ca83695d442018692f4f8a0f41955871c57e6101d7f89a92375caa
    profiles: ["herramientas"]
    environment:
      # libpq: ogr2ogr se conecta con PG:"" usando estas variables.
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data:/data
    working_dir: /data

  # Prueba preliminar de backend (Fase 4, tarea 1). Un prototipo a la vez:
  #   docker compose --profile bench up -d --build --wait bench-fastapi
  bench-fastapi:
    build: ./bench/fastapi
    profiles: ["bench"]
    environment: &bench_env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POOL: "10"
    depends_on:
      db:
        condition: service_healthy

  bench-node:
    build: ./bench/node
    profiles: ["bench"]
    environment: *bench_env
    depends_on:
      db:
        condition: service_healthy

  # k6 1.0.0, fijada por digest. docker compose run --rm k6 run ...
  k6:
    image: grafana/k6:1.0.0@sha256:f21270290d702cbf0a7d6ba5d7ed100b63bcb233b558b885ed787547b3488279
    profiles: ["herramientas"]
    volumes:
      - ./bench:/bench

volumes:
  db_datos:
